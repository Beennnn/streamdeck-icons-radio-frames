<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Radio Button Selection Frames — 76 transparent-centre Stream Deck overlays marking the selected key of a radio-button group">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#141a35"/>
      <stop offset="1" stop-color="#1c1030"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6ea8fe"/>
      <stop offset="0.5" stop-color="#a06bff"/>
      <stop offset="1" stop-color="#ff6ac1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>

  <!-- motif: says what the repo is -->
  <g transform="translate(70,100)">
    <g fill="none" stroke="#2a3358" stroke-width="2">
      <rect x="0" y="10" width="56" height="56" rx="10"/><rect x="132" y="10" width="56" height="56" rx="10"/>
      <rect x="0" y="92" width="56" height="56" rx="10"/><rect x="66" y="92" width="56" height="56" rx="10"/>
      <rect x="132" y="92" width="56" height="56" rx="10"/>
    </g>
    <rect x="66" y="10" width="56" height="56" rx="10" fill="none" stroke="url(#accent)" stroke-width="6" filter="url(#glow)"/>
    <rect x="0" y="92" width="56" height="56" rx="10" fill="none" stroke="url(#accent)" stroke-width="3" opacity="0.45"/>
    <g fill="#5a678f"><rect x="76" y="50" width="36" height="6" rx="3"/><rect x="10" y="132" width="36" height="6" rx="3"/></g>
  </g>

  <!-- title block -->
  <g transform="translate(300,0)">
    <text x="0" y="170" font-family="-apple-system, Segoe UI, sans-serif" font-size="59" font-weight="700" fill="#ffffff" letter-spacing="1.5">RADIO SELECTION FRAMES</text>
    <rect x="2" y="192" width="882" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="2" y="238" font-family="-apple-system, Segoe UI, sans-serif" font-size="24" fill="#aab4d8">76 transparent-centre overlays — 19 colours × 4 styles, title still readable.</text>
    <text x="2" y="276" font-family="Menlo, Consolas, monospace" font-size="17" fill="#7f8bb5">built with sdicons  ·  CC-BY-4.0</text>
  </g>

  <!-- family baseline -->
  <rect x="70" y="312" width="1140" height="3" rx="1.5" fill="#222b4d"/>
  <rect x="70" y="312" width="210" height="3" rx="1.5" fill="url(#accent)"/>
</svg>
